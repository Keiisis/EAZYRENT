name: eazyrent
description: EAZYRENT — visite ton logement avant de payer le zem. Grand Nokoué, Bénin.
publish_to: "none"
version: 0.1.0+1

environment:
  # Plancher aligné sur le formateur « tall » : en dessous de 3.7, dart format
  # applique l'ancien style et les virgules finales ne sont pas gérées.
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État — flux d'événements prédictible, testable avec bloc_test
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Injection typée à la compilation
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation déclarative. Les liens profonds sont le canal d'acquisition n°1 :
  # un routeur impératif rendrait le partage WhatsApp bancal.
  go_router: ^18.0.0

  # Domaine — aucune exception ne traverse la couche métier
  fpdart: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.5.11

  # Local + hors-ligne (P8)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  flutter_secure_storage: ^11.0.0

  # Réseau
  connectivity_plus: ^7.3.1

  # Visite 360 — bundle PSV5/Three.js EMBARQUÉ (assets/tour_engine), pas de CDN :
  # les tours payés doivent démarrer hors-ligne.
  #
  # ⛔ RETIRÉ TEMPORAIREMENT — incompatible AGP 9.1.0.
  # flutter_inappwebview 6.1.5 (dernière version publiée) utilise
  # getDefaultProguardFile('proguard-android.txt'), refusé par AGP 9.
  # Aucune version compatible n'existe. Décision à trancher : voir §Webview
  # dans ARCHITECTURE.md. Rien dans lib/ ne l'importe encore.
  # flutter_inappwebview: ^6.1.5

  # Carte — techno unique, décision tranchée (ARCHITECTURE.md §7)
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.3

  # Images — vignettes redimensionnées CÔTÉ SERVEUR, jamais réduites après coup
  cached_network_image: ^4.0.0

  # Notes vocales (F4) — Opus mono 16 kHz
  record: ^7.1.1
  just_audio: ^0.10.6

  # Push
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Divers
  intl: ^0.20.3 # imposé par flutter_localizations du SDK 3.47
  share_plus: ^13.3.0
  sensors_plus: ^7.1.0 # gyroscope du tour + capteur de luminosité (Plein Soleil)

# AUCUN SDK MARCHAND DE PAIEMENT (P11).
# Une clé marchande embarquée dans un APK est une clé publiée.
# FedaPay / KkiaPay / CinetPay sont appelés exclusivement par Edge Function.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.12
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  injectable_generator: ^3.1.3
  drift_dev: ^2.19.0
  # Tests golden : matchers natifs de flutter_test.
  # `golden_toolkit` a été archivé en 2023 et épingle d'anciennes versions de
  # Flutter — il bloquerait la résolution de dépendances.

flutter:
  uses-material-design: true

  assets:
    - assets/tour_engine/ # bundle Photo Sphere Viewer 5 + Three.js, local
    - assets/icons/

  # Sous-ensemble latin + latin-ext, 5 graisses au total ≈ 180 Ko.
  # Pas de variable font complète : le gain ne vaut pas 250 Ko sur un budget
  # d'APK de 30 Mo (UI_DESIGN_SYSTEM.md §3.1).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
