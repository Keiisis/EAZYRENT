<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NuméroPerduRécupération</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground font-sans pb-12">
      <header
        class="sticky top-0 z-30 bg-card border-b border-border px-4 min-h-14 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <a
            href="#"
            class="min-h-12 min-w-12 -ml-2 inline-flex items-center justify-center rounded-full text-foreground hover:bg-muted focus:outline-none"
            aria-label="Retour"
            ><iconify-icon icon="ph:arrow-left-bold" width="24" height="24"></iconify-icon
          ></a>
          <h1 class="font-heading text-lg font-bold text-foreground">Récupérer mon compte</h1>
        </div>
        <span class="text-xs font-semibold text-muted-foreground">Assistance</span>
      </header>
      <main class="max-w-md mx-auto px-4 pt-4 space-y-6">
        <div class="space-y-1">
          <h2 class="font-heading text-xl font-extrabold text-foreground">
            Tu as changé ou perdu ta puce ?
          </h2>
          <p class="text-sm text-muted-foreground leading-relaxed">
            Récupère immédiatement tes visites 360 achetées, tes crédits restants et tes quittances
            de loyer sur ton nouveau numéro.
          </p>
        </div>
        <section class="bg-card border border-border rounded-2xl p-4 space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-bold text-foreground">Ancien numéro enregistré</label>
            <div class="relative">
              <span
                class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-sm text-muted-foreground"
                >+229</span
              ><input
                type="tel"
                placeholder="97 XX XX XX"
                class="w-full min-h-12 pl-16 pr-3.5 bg-input border border-border rounded-xl font-heading text-base font-bold text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary tabular-nums"
              />
            </div>
          </div>
          <div class="space-y-1.5">
            <label class="block text-xs font-bold text-foreground"
              >Nouveau numéro de téléphone (actuel)</label
            >
            <div class="relative">
              <span
                class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-sm text-muted-foreground"
                >+229</span
              ><input
                type="tel"
                placeholder="96 XX XX XX"
                class="w-full min-h-12 pl-16 pr-3.5 bg-input border border-border rounded-xl font-heading text-base font-bold text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary tabular-nums"
              />
            </div>
          </div>
        </section>
        <section class="space-y-3">
          <h3 class="font-heading text-sm font-bold text-foreground">Méthode de vérification</h3>
          <label
            class="flex items-start gap-3 p-3.5 rounded-2xl border-2 border-primary bg-primary/5 cursor-pointer"
            ><input
              type="radio"
              name="recovery_method"
              checked
              class="mt-1 size-5 text-primary focus:ring-0" />
            <div class="space-y-1 text-xs">
              <span class="font-heading font-bold text-sm text-foreground block"
                >Numéro Personnel d'Identification (NPI / CIP)</span
              >
              <p class="text-muted-foreground">
                Numéro à 10 chiffres figurant sur ton Certificat d'Identification Personnelle
                (ANIP).
              </p>
              <input
                type="text"
                placeholder="Ex: 1029384756"
                class="w-full min-h-12 px-3 mt-2 bg-input border border-border rounded-xl text-sm font-bold text-foreground focus:outline-none focus:border-primary tabular-nums"
              /></div></label
          ><label
            class="flex items-start gap-3 p-3.5 rounded-2xl border border-border bg-card cursor-pointer hover:border-foreground"
            ><input
              type="radio"
              name="recovery_method"
              class="mt-1 size-5 text-primary focus:ring-0"
            />
            <div class="space-y-0.5 text-xs">
              <span class="font-heading font-bold text-sm text-foreground block"
                >Dernier SMS de transaction Mobile Money</span
              >
              <p class="text-muted-foreground">
                ID de transaction reçu lors de ton dernier paiement de visite ou de loyer EAZYRENT.
              </p>
            </div></label
          >
        </section>
        <div class="space-y-3 pt-2">
          <button
            type="button"
            class="w-full min-h-12 bg-primary text-primary-foreground font-heading font-extrabold text-base rounded-full flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.99] transition-all shadow-md"
          >
            <span>Transférer mon compte sur ma nouvelle puce</span
            ><iconify-icon icon="ph:arrow-right-bold" width="20" height="20"></iconify-icon></button
          ><a
            href="#"
            class="w-full min-h-12 bg-secondary text-foreground border border-border font-heading font-bold text-sm rounded-full flex items-center justify-center gap-2 hover:bg-muted"
            ><iconify-icon icon="logos:whatsapp-icon" width="20" height="20"></iconify-icon
            >Contacter le support EAZYRENT sur WhatsApp</a
          >
        </div>
      </main>
    </div>
  </body>
</html>
