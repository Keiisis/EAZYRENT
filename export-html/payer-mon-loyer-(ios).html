<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayerMonLoyerIOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-[#F2F2F7] text-[#000000] font-sans pb-12 safe-area-bottom">
      <div class="sticky top-0 z-40 bg-[#F2F2F7]/85 backdrop-blur-md border-b border-black/10">
        <div
          class="h-11 px-6 flex items-center justify-between text-[14px] font-semibold tracking-tight text-black"
        >
          <span>9:41</span>
          <div class="flex items-center gap-1.5">
            <iconify-icon
              icon="solar:signal-cellular-full-bold"
              width="16"
              height="16"
            ></iconify-icon
            ><iconify-icon
              icon="solar:wifi-router-minimalistic-bold"
              width="16"
              height="16"
            ></iconify-icon
            ><iconify-icon icon="solar:battery-full-bold" width="22" height="22"></iconify-icon>
          </div>
        </div>
        <div class="px-4 py-2 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <button
              type="button"
              class="min-w-12 min-h-12 -ml-2 rounded-full flex items-center justify-center text-[#007AFF] active:opacity-60"
              aria-label="Retour"
            >
              <iconify-icon icon="ph:caret-left-bold" width="24" height="24"></iconify-icon>
            </button>
            <h1 class="font-heading text-[17px] font-bold tracking-tight text-black">
              Paiement du loyer
            </h1>
          </div>
          <button
            class="min-h-12 px-3 inline-flex items-center gap-1 text-[13px] font-bold text-[#007AFF]"
          >
            <iconify-icon icon="ph:receipt-bold" width="18" height="18"></iconify-icon>Quittances
          </button>
        </div>
      </div>
      <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        <div class="bg-white border border-black/10 rounded-2xl p-4 space-y-4 shadow-sm">
          <div class="flex items-center justify-between">
            <span
              class="text-[12px] font-bold px-2.5 py-1 rounded-full bg-[#FF9500]/10 text-[#FF9500] flex items-center gap-1"
              ><iconify-icon icon="ph:clock-countdown-bold" width="16" height="16"></iconify-icon
              >Échéance dans 3 jours (5 Août)</span
            ><span class="text-[12px] font-semibold text-[#8E8E93]">Août 2026</span>
          </div>
          <div class="flex items-start gap-3">
            <div class="size-14 rounded-xl overflow-hidden shrink-0 border border-black/10">
              <img
                src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=200&amp;auto=format&amp;fit=crop&amp;q=80"
                alt="Logement"
                class="size-full object-cover"
              />
            </div>
            <div class="space-y-0.5 min-w-0">
              <h2 class="font-heading text-[15px] font-bold text-black truncate">
                Chambre-salon · Fidjrossè Kpota
              </h2>
              <p class="text-[13px] text-[#8E8E93]">Bailleur : M. Sossou Euloge</p>
              <p class="text-[12px] text-[#8E8E93]">Bail EAZYRENT n° BJ-2026-8841</p>
            </div>
          </div>
          <div class="bg-[#F2F2F7] rounded-xl p-3 flex items-baseline justify-between tabular-nums">
            <span class="text-[13px] text-[#8E8E93]">Montant du loyer :</span
            ><span class="font-heading text-[24px] font-black text-black">35 000 F</span>
          </div>
        </div>
        <section class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <h2 class="font-heading text-[14px] font-bold text-black">Payer avec Mobile Money</h2>
            <span class="text-[12px] text-[#34C759] font-bold flex items-center gap-1"
              ><iconify-icon icon="ph:shield-check-fill" width="16" height="16"></iconify-icon>0
              frais</span
            >
          </div>
          <div class="grid grid-cols-3 gap-2.5">
            <label
              class="cursor-pointer border-2 border-[#D93A1F] bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-1 text-center shadow-xs min-h-20"
              ><input type="radio" name="momo_ios" checked class="sr-only" />
              <div
                class="size-8 rounded-full bg-[#FFCC00] text-black font-black text-[11px] flex items-center justify-center"
              >
                MoMo
              </div>
              <span class="font-heading font-extrabold text-[12px] text-black"
                >MTN MoMo</span
              ></label
            ><label
              class="cursor-pointer border border-black/10 bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-1 text-center min-h-20"
              ><input type="radio" name="momo_ios" class="sr-only" />
              <div
                class="size-8 rounded-full bg-[#005CA9] text-white font-black text-[11px] flex items-center justify-center"
              >
                Flooz
              </div>
              <span class="font-heading font-bold text-[12px] text-black">Moov Flooz</span></label
            ><label
              class="cursor-pointer border border-black/10 bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-1 text-center min-h-20"
              ><input type="radio" name="momo_ios" class="sr-only" />
              <div
                class="size-8 rounded-full bg-[#E30613] text-white font-black text-[11px] flex items-center justify-center"
              >
                Celtiis
              </div>
              <span class="font-heading font-bold text-[12px] text-black">Celtiis</span></label
            >
          </div>
          <div class="space-y-1.5 pt-1">
            <label class="block text-[12px] font-semibold text-[#8E8E93] px-1"
              >Numéro de téléphone payeur</label
            >
            <div class="relative">
              <span
                class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-[14px] text-[#8E8E93]"
                >+229</span
              ><input
                type="tel"
                value="97 00 00 00"
                class="w-full min-h-12 pl-16 pr-3.5 bg-white border border-black/10 rounded-xl font-heading text-[16px] font-bold text-black focus:outline-none focus:border-[#D93A1F] tabular-nums"
              />
            </div>
          </div>
        </section>
        <button
          type="button"
          class="w-full min-h-14 bg-[#D93A1F] text-white font-heading font-extrabold text-[16px] rounded-full flex items-center justify-center gap-2 shadow-sm active:opacity-90"
        >
          <iconify-icon icon="ph:lock-simple-bold" width="20" height="20"></iconify-icon
          ><span>Payer 35 000 F de loyer</span>
        </button>
        <div class="h-1 w-32 bg-black/25 rounded-full mx-auto mt-2"></div>
      </main>
    </div>
  </body>
</html>
