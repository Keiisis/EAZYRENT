<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalerBienPlusLibreB03SignalerBienPlusLibreB03</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main
      class="min-h-screen bg-background text-foreground font-sans px-4 py-8 flex flex-col justify-between max-w-md mx-auto"
    >
      <div class="space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-border">
          <div class="flex items-center gap-2">
            <span class="size-2 rounded-full bg-[#D93A1F]"></span
            ><span class="text-[13px] font-bold text-muted-foreground uppercase tracking-wider"
              >Signalement communautaire</span
            >
          </div>
          <button
            class="size-11 rounded-full bg-muted flex items-center justify-center text-foreground active:scale-95 transition"
            aria-label="Fermer"
          >
            <iconify-icon icon="ph:x-bold" width="20" height="20"></iconify-icon>
          </button>
        </div>
        <div class="space-y-1">
          <h1 class="font-heading text-[24px] font-extrabold text-foreground leading-tight">
            Ce bien n'est plus libre ?
          </h1>
          <p class="text-[16px] text-muted-foreground leading-snug">
            Merci de le signaler. On vérifie sur place sous 2h et on prévient la communauté.
          </p>
        </div>
        <div class="p-3 bg-muted/40 rounded-2xl border border-border flex items-center gap-3">
          <div
            class="size-14 rounded-xl bg-card border border-border flex items-center justify-center text-[#00708A] shrink-0 font-bold text-[14px]"
          >
            360°
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-[14px] font-bold text-foreground truncate">Chambre-salon · Fidjrossè</p>
            <p class="text-[13px] text-[#C4321A] font-extrabold tabular-nums">35 000 F /mois</p>
          </div>
        </div>
        <div class="space-y-3 pt-2">
          <p class="text-[14px] font-bold text-foreground">Que s'est-il passé ?</p>
          <label
            class="flex items-start gap-3 p-4 rounded-2xl border-2 border-[#D93A1F] bg-card cursor-pointer"
            ><input name="reason" type="radio" class="mt-1 size-5 accent-[#D93A1F]" checked />
            <div>
              <span class="block text-[16px] font-bold text-foreground"
                >Le propriétaire dit qu'il est loué</span
              ><span class="text-[13px] text-muted-foreground"
                >Appel ou message direct avec le bailleur</span
              >
            </div></label
          ><label
            class="flex items-start gap-3 p-4 rounded-2xl border border-border bg-card cursor-pointer"
            ><input name="reason" type="radio" class="mt-1 size-5 accent-[#D93A1F]" />
            <div>
              <span class="block text-[16px] font-bold text-foreground"
                >Je suis passé sur place, c'est occupé</span
              ><span class="text-[13px] text-muted-foreground"
                >Il y a déjà un locataire installé dans les lieux</span
              >
            </div></label
          ><label
            class="flex items-start gap-3 p-4 rounded-2xl border border-border bg-card cursor-pointer"
            ><input name="reason" type="radio" class="mt-1 size-5 accent-[#D93A1F]" />
            <div>
              <span class="block text-[16px] font-bold text-foreground"
                >Personne ne répond depuis plusieurs jours</span
              ><span class="text-[13px] text-muted-foreground"
                >Numéro injoignable ou silence prolongé</span
              >
            </div></label
          >
        </div>
      </div>
      <div class="space-y-3 pt-6">
        <div
          class="p-3.5 bg-[#006B4A]/10 border border-[#006B4A]/30 rounded-2xl flex items-center gap-3"
        >
          <div
            class="size-10 rounded-xl bg-[#006B4A] text-white flex items-center justify-center shrink-0"
          >
            <iconify-icon icon="ph:gift-bold" width="22" height="22"></iconify-icon>
          </div>
          <div class="min-w-0">
            <p class="text-[14px] font-bold text-[#006B4A]">1 Visite 360 offerte</p>
            <p class="text-[13px] text-muted-foreground leading-tight">
              Créditée sur ton compte dès vérification de l'agent.
            </p>
          </div>
        </div>
        <button
          class="w-full min-h-12 py-3.5 px-6 rounded-full bg-[#D93A1F] text-white font-heading font-extrabold text-[16px] text-center shadow-md active:opacity-90"
        >
          Envoyer le signalement
        </button>
      </div>
    </main>
  </body>
