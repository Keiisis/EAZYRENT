<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaiementIOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen bg-black/60 flex items-end font-sans antialiased">
      <div
        class="w-full bg-[#F2F2F7] text-foreground rounded-t-[28px] border-t border-border/80 p-5 pb-8 space-y-4 max-h-[92vh] overflow-y-auto safe-area-bottom shadow-2xl"
      >
        <div class="w-10 h-1.5 bg-muted-foreground/30 rounded-full mx-auto"></div>
        <div>
          <h1 class="font-heading text-[22px] font-black text-foreground">Voir tout le logement</h1>
          <p class="text-[15px] text-muted-foreground mt-0.5">
            Un aller-retour zem te coûte ~2 000 F.
          </p>
          <p class="text-[15px] font-bold text-foreground">Cette visite complète : 1 000 F.</p>
        </div>
        <div class="space-y-2.5">
          <label
            class="flex items-center justify-between p-4 rounded-2xl border border-border/80 bg-white cursor-pointer min-h-14 shadow-xs"
            ><div class="flex items-center gap-3">
              <input name="pack" type="radio" class="size-5 accent-[#C4321A]" /><span
                class="text-[16px] font-bold text-foreground"
                >1 visite</span
              >
            </div>
            <span class="text-[16px] font-extrabold tabular-nums text-foreground"
              >1 000 F</span
            ></label
          ><label
            class="flex items-center justify-between p-4 rounded-2xl border-2 border-primary bg-white cursor-pointer relative min-h-14 shadow-xs"
            ><span
              class="absolute -top-2.5 right-4 rounded-md bg-[#006B4A] text-white text-[11px] font-black px-2 py-0.5"
              >ÉCONOMIE</span
            >
            <div class="flex items-center gap-3">
              <input name="pack" type="radio" class="size-5 accent-[#C4321A]" checked />
              <div>
                <p class="text-[16px] font-bold text-foreground">Pack Quartier — 3 visites</p>
                <p class="text-[13px] text-muted-foreground">soit 833 F la visite</p>
              </div>
            </div>
            <span class="text-[16px] font-extrabold tabular-nums text-foreground"
              >2 500 F</span
            ></label
          ><label
            class="flex items-center justify-between p-4 rounded-2xl border border-border/80 bg-white cursor-pointer min-h-14 shadow-xs"
            ><div class="flex items-center gap-3">
              <input name="pack" type="radio" class="size-5 accent-[#C4321A]" /><span
                class="text-[16px] font-bold text-foreground"
                >Pack Chasseur — 7 visites</span
              >
            </div>
            <span class="text-[16px] font-extrabold tabular-nums text-foreground"
              >5 000 F</span
            ></label
          >
        </div>
        <div>
          <p class="text-[14px] font-bold text-foreground mb-2">Paye avec Mobile Money Bénin</p>
          <div class="grid grid-cols-3 gap-2">
            <button
              class="p-3 rounded-2xl border-2 border-primary bg-white flex flex-col items-center gap-1.5 min-h-20 justify-center shadow-xs active:bg-muted/40"
            >
              <div
                class="size-8 rounded-full bg-[#FFCC00] text-black flex items-center justify-center font-black text-[11px]"
              >
                MTN
              </div>
              <span class="text-[13px] font-bold">MTN MoMo</span></button
            ><button
              class="p-3 rounded-2xl border border-border/80 bg-white flex flex-col items-center gap-1.5 min-h-20 justify-center shadow-xs active:bg-muted/40"
            >
              <div
                class="size-8 rounded-full bg-[#005BAC] text-white flex items-center justify-center font-black text-[11px]"
              >
                MOOV
              </div>
              <span class="text-[13px] font-bold">Moov Flooz</span></button
            ><button
              class="p-3 rounded-2xl border border-border/80 bg-white flex flex-col items-center gap-1.5 min-h-20 justify-center shadow-xs active:bg-muted/40"
            >
              <div
                class="size-8 rounded-full bg-[#E30613] text-white flex items-center justify-center font-black text-[11px]"
              >
                CEL
              </div>
              <span class="text-[13px] font-bold">Celtiis Cash</span>
            </button>
          </div>
        </div>
        <div class="space-y-1.5 text-[13px] text-muted-foreground pt-1">
          <p class="flex items-start gap-2">
            <span>ⓘ</span
            ><span>Si ce bien n'est plus libre, visite automatiquement recréditée.</span>
          </p>
          <p class="flex items-start gap-2">
            <span>ⓘ</span><span>Accès permanent et hors-ligne garanti.</span>
          </p>
        </div>
        <button
          class="w-full min-h-14 rounded-full bg-primary font-bold text-[16px] text-white shadow-md active:opacity-90"
        >
          Payer 1 000 F
        </button>
        <div class="h-1 w-36 bg-black/30 rounded-full mx-auto mt-3"></div>
      </div>
    </main>
  </body>
</html>
