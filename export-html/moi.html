<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen bg-background text-foreground font-sans px-4 pt-5 pb-32">
      <header class="pb-2">
        <h1 class="font-heading text-[28px] font-extrabold text-foreground">Moi</h1>
      </header>
      <section
        class="mt-3 rounded-2xl border border-border bg-card divide-y divide-border overflow-hidden"
      >
        <a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Mes visites</span
          ><iconify-icon
            icon="ph:caret-right-bold"
            width="18"
            height="18"
            class="text-muted-foreground"
          ></iconify-icon></a
        ><a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Crédits</span
          ><span class="text-[16px] font-extrabold tabular-nums text-foreground">2</span></a
        ><a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Économies</span
          ><span class="text-[16px] font-extrabold tabular-nums text-[#006B4A]">6 500 F</span></a
        >
        <div class="flex items-center justify-between p-4 min-h-14">
          <span class="text-[16px] font-semibold text-foreground">Alerte quartier</span>
          <div class="w-12 h-7 bg-primary rounded-full p-0.5 flex items-center justify-end">
            <div class="size-6 rounded-full bg-white shadow"></div>
          </div>
        </div>
        <a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Parrainage</span
          ><iconify-icon
            icon="ph:caret-right-bold"
            width="18"
            height="18"
            class="text-muted-foreground"
          ></iconify-icon></a
        ><a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Thème</span
          ><span class="text-[14px] text-muted-foreground">Clair</span></a
        >
        <div class="flex items-center justify-between p-4 min-h-14">
          <span class="text-[16px] font-semibold text-foreground">Mode Léger</span>
          <div class="w-12 h-7 bg-muted rounded-full p-0.5 flex items-center justify-start">
            <div class="size-6 rounded-full bg-white shadow border border-border"></div>
          </div>
        </div>
        <a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Notifications</span
          ><iconify-icon
            icon="ph:caret-right-bold"
            width="18"
            height="18"
            class="text-muted-foreground"
          ></iconify-icon></a
        ><a class="flex items-center justify-between p-4 min-h-14"
          ><span class="text-[16px] font-semibold text-foreground">Aide</span
          ><iconify-icon
            icon="ph:caret-right-bold"
            width="18"
            height="18"
            class="text-muted-foreground"
          ></iconify-icon
        ></a>
      </section>
      <nav
        class="fixed bottom-0 left-0 right-0 z-20 border-t border-border bg-card px-2 pt-1 pb-4 safe-area-bottom"
      >
        <div class="flex">
          <a
            class="flex-1 min-h-12 flex flex-col items-center justify-center gap-1 text-muted-foreground text-[13px]"
            ><iconify-icon icon="ph:magnifying-glass-bold" width="20" height="20"></iconify-icon
            >Chercher</a
          ><a
            class="flex-1 min-h-12 flex flex-col items-center justify-center gap-1 text-muted-foreground text-[13px]"
            ><iconify-icon icon="ph:heart-bold" width="20" height="20"></iconify-icon>Ma liste</a
          ><a
            class="flex-1 min-h-12 flex flex-col items-center justify-center gap-1 text-muted-foreground text-[13px]"
            ><iconify-icon icon="ph:chat-circle-dots-bold" width="20" height="20"></iconify-icon
            >Messages</a
          ><a
            class="flex-1 min-h-12 flex flex-col items-center justify-center gap-1 text-primary text-[13px] font-bold"
            ><iconify-icon icon="ph:user-circle-bold" width="20" height="20"></iconify-icon>Moi</a
          >
        </div>
        <div class="h-1 w-32 bg-foreground/20 rounded-full mx-auto mt-1"></div>
      </nav>
    </main>
  </body>
</html>
