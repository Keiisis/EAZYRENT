<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeDuelIOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="min-h-screen bg-[#F2F2F7] text-[#000000] font-sans antialiased flex flex-col justify-between"
    >
      <div class="sticky top-0 z-30 bg-[#F2F2F7]/80 backdrop-blur-md border-b border-black/10">
        <div class="h-11 px-6 flex items-center justify-between text-xs font-semibold text-black">
          <span>9:41</span>
          <div class="flex items-center gap-1.5">
            <iconify-icon icon="solar:signal-cellular-bold" width="14" height="14"></iconify-icon
            ><iconify-icon
              icon="material-symbols:wifi-rounded"
              width="14"
              height="14"
            ></iconify-icon
            ><iconify-icon icon="solar:battery-charge-bold" width="18" height="18"></iconify-icon>
          </div>
        </div>
        <div class="px-4 py-2.5 flex items-center justify-between">
          <button
            type="button"
            class="min-w-12 min-h-12 -ml-2 rounded-full flex items-center justify-center text-[#007AFF] active:opacity-60"
            aria-label="Retour"
          >
            <iconify-icon icon="solar:arrow-left-linear" width="24" height="24"></iconify-icon>
          </button>
          <h1 class="font-heading font-extrabold text-[17px] text-center">Le Duel</h1>
          <span class="text-[13px] font-bold text-black/50 tabular-nums">1 sur 3</span>
        </div>
      </div>
      <main class="flex-1 px-4 py-3 space-y-4">
        <div
          class="bg-white rounded-2xl p-3 border border-black/5 shadow-xs grid grid-cols-2 gap-3 divide-x divide-black/10"
        >
          <article class="space-y-3 pr-1.5">
            <div class="aspect-square rounded-xl overflow-hidden bg-black/5">
              <img
                alt="Logement A"
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/yqwTzo2JarQ/components/fb5ANajxPq0.jpeg"
                class="w-full h-full object-cover"
              />
            </div>
            <div>
              <p
                class="font-heading text-[20px] font-extrabold tabular-nums leading-tight text-black"
              >
                35 000 F
              </p>
              <p class="text-[12px] text-black/60 font-semibold">/mois</p>
              <p class="text-[14px] font-bold text-black mt-0.5">Fidjrossè</p>
            </div>
            <div class="space-y-2 text-[13px] border-t border-black/10 pt-2">
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold"
                  >Entrée totale</span
                >
                <p class="font-extrabold text-[15px] text-black tabular-nums">245 000 F</p>
                <p class="text-[11px] text-black/50">(3 mois)</p>
              </div>
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold">Fraîcheur</span>
                <p class="font-extrabold text-[#006B4A]">● 09h12</p>
              </div>
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold">Trajet</span>
                <p class="font-extrabold text-black">~22 min</p>
              </div>
              <div class="opacity-50">
                <span class="block text-[11px] text-black/50 uppercase">Compteur</span>
                <p class="text-[12px] text-black/70">SBEE carte</p>
              </div>
              <div class="opacity-50">
                <span class="block text-[11px] text-black/50 uppercase">Eau</span>
                <p class="text-[12px] text-black/70">SONEB</p>
              </div>
            </div>
            <button
              class="w-full min-h-12 rounded-full bg-[#D93A1F] text-white font-bold text-[14px] mt-2 active:opacity-80"
            >
              Garder A
            </button>
          </article>
          <article class="space-y-3 pl-3">
            <div class="aspect-square rounded-xl overflow-hidden bg-black/5">
              <img
                alt="Logement B"
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/yqwTzo2JarQ/components/MFqr7ZYs66X.jpeg"
                class="w-full h-full object-cover"
              />
            </div>
            <div>
              <p
                class="font-heading text-[20px] font-extrabold tabular-nums leading-tight text-black"
              >
                42 000 F
              </p>
              <p class="text-[12px] text-black/60 font-semibold">/mois</p>
              <p class="text-[14px] font-bold text-black mt-0.5">Cadjèhoun</p>
            </div>
            <div class="space-y-2 text-[13px] border-t border-black/10 pt-2">
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold"
                  >Entrée totale</span
                >
                <p class="font-extrabold text-[15px] text-black tabular-nums">294 000 F</p>
                <p class="text-[11px] text-black/50">(3 mois)</p>
              </div>
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold">Fraîcheur</span>
                <p class="font-extrabold text-[#006B4A]">● 08h40</p>
              </div>
              <div>
                <span class="block text-[11px] text-black/50 uppercase font-bold">Trajet</span>
                <p class="font-extrabold text-black">~18 min</p>
              </div>
              <div class="opacity-50">
                <span class="block text-[11px] text-black/50 uppercase">Compteur</span>
                <p class="text-[12px] text-black/70">SBEE carte</p>
              </div>
              <div class="opacity-50">
                <span class="block text-[11px] text-black/50 uppercase">Eau</span>
                <p class="text-[12px] text-black/70">SONEB</p>
              </div>
            </div>
            <button
              class="w-full min-h-12 rounded-full bg-[#E5E5EA] text-black font-bold text-[14px] mt-2 active:bg-[#D1D1D6]"
            >
              Garder B
            </button>
          </article>
        </div>
        <div class="flex items-center justify-around pt-1">
          <button
            class="min-h-12 px-6 rounded-full text-[14px] font-bold text-[#007AFF] active:opacity-60"
          >
            Les deux</button
          ><span class="text-black/20">·</span
          ><button
            class="min-h-12 px-6 rounded-full text-[14px] font-bold text-[#FF3B30] active:opacity-60"
          >
            Aucun des deux
          </button>
        </div>
      </main>
      <div class="p-2 pb-3 safe-area-bottom">
        <div class="h-1 w-36 bg-black/25 rounded-full mx-auto"></div>
      </div>
    </div>
  </body>
</html>
