<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnexionEtOTPAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F8FAFC;
        --foreground: #0B0F19;
        --primary: #D93A1F;
        --primary-foreground: #FFFFFF;
        --secondary: #FFFFFF;
        --secondary-foreground: #0B0F19;
        --muted: #E7EBF1;
        --muted-foreground: #55617A;
        --accent: #00708A;
        --accent-foreground: #FFFFFF;
        --destructive: #B42318;
        --card: #FFFFFF;
        --card-foreground: #0B0F19;
        --popover: #FFFFFF;
        --popover-foreground: #0B0F19;
        --border: #CBD3DF;
        --input: #FFFFFF;
        --ring: #C4321A;
        --chart-1: #C4321A;
        --chart-2: #006B4A;
        --chart-3: #00708A;
        --chart-4: #8A5A00;
        --chart-5: #55617A;

        --font-sans: "Inter";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main
      class="min-h-screen bg-background text-foreground font-sans px-4 pt-6 pb-6 flex flex-col justify-between"
    >
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <button
            class="min-w-12 min-h-12 -ml-2 rounded-full flex items-center justify-center active:bg-muted"
            aria-label="Retour"
          >
            <iconify-icon icon="ph:arrow-left-bold" width="24" height="24"></iconify-icon></button
          ><span
            class="text-[13px] font-bold text-[#55617A] bg-card border border-border px-3 py-1.5 rounded-full"
            >Auth béninoise (MTN / Moov)</span
          >
        </div>
        <div class="space-y-2">
          <span class="text-[13px] font-bold text-[#C4321A] uppercase tracking-wider"
            >Étape 2 sur 2</span
          >
          <h1 class="font-heading text-[28px] font-extrabold leading-tight text-foreground">
            Entre le code SMS
          </h1>
          <p class="text-[16px] text-muted-foreground leading-snug">
            Envoyé au <span class="font-bold text-foreground tabular-nums">+229 97 12 34 56</span> ·
            <a href="#" class="text-[#C4321A] font-bold underline">modifier</a>
          </p>
        </div>
        <div class="pt-2">
          <div class="grid grid-cols-6 gap-2">
            <div
              class="min-h-14 rounded-xl border border-border bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-foreground"
            >
              5
            </div>
            <div
              class="min-h-14 rounded-xl border border-border bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-foreground"
            >
              2
            </div>
            <div
              class="min-h-14 rounded-xl border border-border bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-foreground"
            >
              9
            </div>
            <div
              class="min-h-14 rounded-xl border-2 border-[#D93A1F] bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-foreground animate-pulse"
            >
              |
            </div>
            <div
              class="min-h-14 rounded-xl border border-border bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-muted-foreground"
            >
              •
            </div>
            <div
              class="min-h-14 rounded-xl border border-border bg-card flex items-center justify-center font-heading text-[24px] font-extrabold tabular-nums text-muted-foreground"
            >
              •
            </div>
          </div>
          <p class="text-[13px] text-muted-foreground mt-3 flex items-center gap-1.5">
            <iconify-icon
              icon="ph:device-mobile-bold"
              class="text-foreground shrink-0"
            ></iconify-icon
            >Remplissage automatique depuis le SMS activé.
          </p>
        </div>
        <div class="p-4 rounded-xl border border-border bg-card space-y-3">
          <div class="flex items-center justify-between text-[14px]">
            <span class="text-muted-foreground">Tu n'as rien reçu ?</span
            ><span class="font-bold text-foreground tabular-nums">⏱ 0:42</span>
          </div>
          <div class="flex gap-2">
            <button
              disabled
              class="flex-1 min-h-12 rounded-xl border border-border bg-muted/50 text-[13px] font-bold text-muted-foreground flex items-center justify-center gap-1.5"
            >
              <iconify-icon icon="ph:arrow-clockwise-bold" width="18" height="18"></iconify-icon>
              Renvoyer par SMS</button
            ><button
              class="min-h-12 px-4 rounded-xl border border-border bg-card text-[13px] font-bold text-foreground flex items-center justify-center gap-1.5 active:bg-muted"
            >
              <iconify-icon icon="ph:phone-call-bold" width="18" height="18"></iconify-icon> Appel
              vocal
            </button>
          </div>
        </div>
      </div>
      <div class="space-y-4 pt-6">
        <button
          class="w-full min-h-14 rounded-full bg-primary font-bold text-[16px] text-primary-foreground shadow-md flex items-center justify-center gap-2 active:opacity-90"
        >
          <span>Valider le code</span
          ><iconify-icon icon="ph:arrow-right-bold" width="20" height="20"></iconify-icon>
        </button>
        <div class="text-center space-y-1">
          <a
            href="#"
            class="inline-block text-[14px] font-semibold text-muted-foreground hover:text-foreground"
            >Tu n'as plus accès à ce numéro ?
            <span class="text-[#C4321A] font-bold">Récupérer mon compte</span></a
          >
          <p class="text-[13px] text-muted-foreground">
            Conforme aux directives APDP Bénin (Loi n°2017-20)
          </p>
        </div>
        <div class="h-1 w-32 bg-foreground/20 rounded-full mx-auto mt-2"></div>
      </div>
    </main>
  </body>
</html>
