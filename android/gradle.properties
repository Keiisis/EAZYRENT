# 7,7 Go de RAM sur cette machine, dont ~2 Go pris par l'émulateur.
# 2 Go de tas laissent D8 travailler sans faire ramer le garbage collector,
# ce qui est ce qui a tué le démon la première fois — pas le manque de tas,
# le thrashing.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# Un seul worker : deux processus de dexing en parallèle sur 7,7 Go, c'est
# la même OutOfMemory avec deux fois moins de chances de la diagnostiquer.
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
